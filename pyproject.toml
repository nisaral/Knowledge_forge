[project]
name = "knowledge-forge"
version = "2.1.0"
description = "Hybrid-search RAG learning assistant built on Flask and Gemini."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
js = ["playwright==1.64.1"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["static", "templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that need real network access (deselected by default)"]
addopts = "-m 'not network'"
filterwarnings = ["ignore::FutureWarning"]
